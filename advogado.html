<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEXIAN - Painel do Advogado</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="css/tailwind-config.js"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="h-screen h-dvh flex flex-col overflow-hidden antialiased">

    <!-- CABEÇALHO -->
    <header class="shrink-0 border-b border-brand-border flex flex-wrap items-center justify-between gap-2 px-4 py-2 bg-brand-dark/80 backdrop-blur">
        <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-xl bg-brand-emerald flex items-center justify-center text-brand-dark font-bold text-xl shadow-lg shadow-brand-emerald/20">
                <i class="fa-solid fa-scale-balanced"></i>
            </div>
            <div>
                <h1 class="font-bold text-lg tracking-wide text-white leading-tight">LEXIAN</h1>
                <p class="text-[11px] text-gray-400 leading-tight">Painel do Advogado</p>
            </div>
        </div>
        <div class="flex items-center gap-2">
            <button id="clearBtn" type="button" class="text-xs bg-brand-card hover:bg-brand-border border border-brand-border text-gray-300 hover:text-red-400 px-3 py-1.5 rounded-lg transition flex items-center gap-1.5 font-medium">
                <i class="fa-solid fa-trash-can"></i>
                <span>Limpar casos</span>
            </button>
            <a href="index.html" class="text-xs bg-brand-card hover:bg-brand-border border border-brand-border text-brand-emerald hover:text-white px-3 py-1.5 rounded-lg transition flex items-center gap-1.5 font-medium">
                <i class="fa-solid fa-arrow-left"></i>
                <span>Voltar ao site do cliente</span>
            </a>
        </div>
    </header>

    <!-- AVISO LEGAL -->
    <div class="shrink-0 px-4 pt-3">
        <div class="bg-brand-card border border-brand-emerald/30 rounded-xl p-3 shadow-md">
            <div class="flex items-start gap-3">
                <div class="w-7 h-7 rounded-lg bg-brand-emerald/10 border border-brand-emerald/30 flex items-center justify-center text-brand-emerald shrink-0">
                    <i class="fa-solid fa-shield-halved text-xs"></i>
                </div>
                <p class="text-xs leading-relaxed text-gray-300">Este é um assistente virtual automatizado para triagem de fatos. Ele não fornece consultoria jurídica. Suas respostas serão analisadas por advogados humanos.</p>
            </div>
        </div>
    </div>

    <!-- LISTA + FICHA -->
    <div class="flex-1 min-h-0 flex flex-col md:flex-row mt-3 border-t border-brand-border">
        <aside class="md:w-80 shrink-0 max-h-[38%] md:max-h-none overflow-y-auto border-b md:border-b-0 md:border-r border-brand-border bg-brand-card/40 p-3">
            <h2 class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2 px-1">Casos recebidos</h2>
            <div id="listaCasos" class="space-y-2"></div>
        </aside>
        <section id="fichaCaso" class="flex-1 min-w-0 overflow-y-auto p-4"></section>
    </div>

    <script src="src/common.js"></script>
    <script src="src/scripts/advogado.js"></script>
</body>
</html>
